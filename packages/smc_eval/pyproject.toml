[project]
name = "smc-eval"
version = "0.1.0"
description = "The evaluation of the localisation loop on a frozen dataset: metrics, a simulated operator, injected faults"
readme = "README.md"
authors = [
    { name = "Łukasz Olszewski", email = "lukaszolszewski96@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "smc-agent",
    "smc-core",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
smc-agent = { workspace = true }
smc-core = { workspace = true }
