[project]
name = "smc-perception"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Łukasz Olszewski", email = "lukaszolszewski96@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "langgraph-checkpoint-aws>=1.2.5",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "smc-agent",
    "smc-core",
    "uvicorn>=0.53.0",
]

[project.scripts]
smc-perception = "smc_perception:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
smc-agent = { workspace = true }
smc-core = { workspace = true }
