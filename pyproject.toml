[tool.uv.workspace]
members = ["services/*"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "B",         # bugbear
    "UP",        # pyupgrade
    "SIM",       # simplify
    "RUF",       # ruff-specific
]
ignore = ["E501"]   # line length is enforced by the formatter

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["services/perception/tests"]
addopts = "-ra --strict-markers"

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
pretty = true
files = ["services/perception/src"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
]
