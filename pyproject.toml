[tool.uv.workspace]
members = ["services/*"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "B",         # bugbear
    "UP",        # pyupgrade
    "SIM",       # simplify
    "RUF",       # ruff-specific
]
ignore = ["E501"]   # line length is enforced by the formatter

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["services/perception/tests", "tests"]
pythonpath = ["tools"]
addopts = "-ra --strict-markers"

[tool.basedpyright]
extraPaths = ["tools"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
pretty = true
files = ["services/perception/src"]

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "mypy>=2.3.1",
    "opencv-python-headless>=5.0.0.93",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "reportlab>=5.0.1",
    "ruff>=0.16.7",
]
