[tool.uv.workspace]
members = [
    "services/*",
    "packages/*",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E", "W",    # pycodestyle
    "F",         # pyflakes
    "I",         # isort
    "B",         # bugbear
    "UP",        # pyupgrade
    "SIM",       # simplify
    "RUF",       # ruff-specific
]
ignore = ["E501"]   # line length is enforced by the formatter

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["services/perception/tests", "packages/smc_core/tests", "tests"]
pythonpath = ["tools"]
addopts = "-ra --strict-markers"

[tool.basedpyright]
extraPaths = ["tools"]

[tool.pylint.main]
# The tests import the scripts in tools/ as top-level modules (see pytest's pythonpath).
init-hook = "import sys; sys.path.insert(0, 'tools')"

[tool.pylint.typecheck]
# cv2 is a Python package that loads its native module at import time, so pylint
# finds no functions in it and flags every cv2 call as no-member (E1101).
ignored-modules = ["cv2"]

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
pretty = true
files = ["services/perception/src", "packages/smc_core/src"]

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "reportlab>=5.0.1",
    "ruff>=0.16.7",
]
